name: Mobile Rust checks
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  android-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: 'false'
      - name: Configure NDK compiler
        shell: bash
        run: |
          ndk_bin="${ANDROID_HOME:?}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '%s\n' \
            "CC_aarch64_linux_android=$ndk_bin/aarch64-linux-android24-clang" \
            "AR_aarch64_linux_android=$ndk_bin/llvm-ar" \
            "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm run check:mobile-boundaries
      - run: cargo check --locked -p hm-app --lib --target aarch64-linux-android
  ios-rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked -p hm-app --lib --target aarch64-apple-ios-sim
