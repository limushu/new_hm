name: Hosted identity preparation
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply reviewed metadata schema and deploy delete-account to an existing Supabase project'
        required: true
        type: boolean
        default: false
      configure_auth:
        description: 'Add the native callback and manual identity linking while preserving existing provider credentials'
        required: true
        type: boolean
        default: false
      configure_apple:
        description: 'Configure Apple OAuth and account deletion from Sign in with Apple GitHub Secrets'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/identity
      - run: npm run identity:prepare
      - name: Check project and management access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-identity-project.mjs
      - run: node scripts/deploy-identity.mjs
      - name: Apply hosted identity deployment
        if: inputs.apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-identity.mjs --apply
      - name: Configure native authentication routing
        if: inputs.configure_auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/configure-identity-auth.mjs --apply
      - name: Configure Apple provider and account deletion
        if: inputs.configure_apple
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLE_SIGN_IN_TEAM_ID: ${{ secrets.APPLE_SIGN_IN_TEAM_ID }}
          APPLE_SIGN_IN_KEY_ID: ${{ secrets.APPLE_SIGN_IN_KEY_ID }}
          APPLE_SIGN_IN_CLIENT_ID: ${{ secrets.APPLE_SIGN_IN_CLIENT_ID }}
          APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
        run: node scripts/configure-apple-identity.mjs --apply
      - name: Verify deployed project
        if: inputs.apply || inputs.configure_auth || inputs.configure_apple
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-identity-project.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: identity-deployment-${{ github.run_id }}
          path: artifacts/identity/
          if-no-files-found: error
          retention-days: 14
