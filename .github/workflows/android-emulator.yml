name: Android emulator checks
on:
  workflow_dispatch:
    inputs:
      debug_run_id:
        description: 'Optional prior run containing android-debug-apk (same product source)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-emulator-v1
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: 'false'
      - name: Configure Android SDK
        run: |
          printf '%s\n' "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install android
      - name: Build the inspectable emulator application
        if: ${{ !inputs.debug_run_id }}
        run: |
          npx tauri android init --ci --skip-targets-install
          node scripts/prepare-android.mjs
          npx tauri android build --debug --target x86_64 --apk --ci
          cd src-tauri/gen/android
          ./gradlew --stop
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.debug_run_id }}
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
      - uses: actions/download-artifact@v4
        if: ${{ inputs.debug_run_id != '' }}
        with:
          name: android-debug-apk
          run-id: ${{ inputs.debug_run_id }}
          github-token: ${{ github.token }}
          path: src-tauri/gen/android/app/build/outputs/apk
      - name: Verify the APK product source
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_BUILD_RUN: ${{ inputs.debug_run_id || github.run_id }}
        run: |
          [[ "$ANDROID_BUILD_RUN" =~ ^[0-9]+$ ]]
          apk_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_BUILD_RUN" --jq .head_sha)
          [[ "$apk_sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$apk_sha" != "$GITHUB_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$apk_sha"
          fi
          git diff --exit-code "$apk_sha" "$GITHUB_SHA" -- src crates src-tauri public Cargo.toml Cargo.lock package.json package-lock.json index.html vite.config.ts 'tsconfig*.json' scripts/prepare-android.mjs scripts/copy-pdf-assets.mjs
          printf '%s\n' "ANDROID_APK_SOURCE_SHA=$apk_sha" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native Android flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell settings put global heads_up_notifications_enabled 0
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell pm disable-user --user 0 com.google.android.gms
            adb shell am force-stop com.google.android.apps.nexuslauncher
            timeout --signal=SIGINT --kill-after=20s 300s node tests/native/android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 14
