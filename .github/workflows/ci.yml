name: Application checks
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run icons:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - run: npx playwright test tests/ui/dropdown-dismissal.spec.ts tests/ui/transcription.spec.ts tests/ui/voice-input.spec.ts tests/ui/appearance-layout.spec.ts tests/ui/core-flow-layout.spec.ts tests/ui/object-details.spec.ts tests/ui/today-navigation.spec.ts tests/ui/backup-files.spec.ts tests/ui/account-settings.spec.ts tests/ui/cloud-sync.spec.ts tests/ui/device-agenda.spec.ts --browser=webkit --timeout=60000
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p hm-core -p hm-runtime -p hm-application
      - run: cargo clippy --locked -p hm-core -p hm-runtime -p hm-application --all-targets -- -D warnings
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --locked -p hm-core -p hm-runtime -p hm-application
      - run: npx tauri build --debug --no-bundle --ci
