name: CloudKit production configuration
on:
  workflow_dispatch:
    inputs:
      deploy_schema:
        description: 'Import and deploy the reviewed Anjian record schema to CloudKit Production'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 15
    environment: ios-testflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify iCloud capability and refresh distribution profile
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          node --input-type=module <<'JS'
          import { cloudSigning } from './scripts/ios-cloudkit-signing.mjs';
          const result=await cloudSigning({keyId:process.env.APPLE_API_KEY,issuer:process.env.APPLE_API_ISSUER,privateKey:process.env.APPLE_API_PRIVATE_KEY},{profile:process.env.IOS_MOBILE_PROVISION,create:true});
          console.log(JSON.stringify({capability:result.capability,existingProfileReady:result.profileReady}));
          JS
      - name: Inspect installed CloudKit command interface
        if: always()
        run: |
          xcrun cktool --help
          xcrun cktool import-schema --help
          xcrun cktool export-schema --help
      - name: Deploy reviewed schema
        if: inputs.deploy_schema
        env:
          CKTOOL_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
        run: node scripts/cloudkit-schema.mjs
