[workspace]
members = ["crates/hm-core", "crates/hm-runtime", "crates/hm-application", "crates/tauri-plugin-hm-recording", "crates/tauri-plugin-hm-documents", "crates/tauri-plugin-hm-speech", "crates/tauri-plugin-hm-cloudkit", "crates/tauri-plugin-hm-identity", "crates/tauri-plugin-hm-agenda", "src-tauri"]
default-members = ["crates/hm-core", "crates/hm-runtime", "crates/hm-application"]
resolver = "2"

[workspace.package]
version = "1.8.2"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
