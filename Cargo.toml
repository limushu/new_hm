[workspace]
members = ["crates/hm-core", "crates/hm-runtime", "crates/hm-application", "src-tauri"]
default-members = ["crates/hm-core", "crates/hm-runtime", "crates/hm-application"]
resolver = "2"

[workspace.package]
version = "1.4.3"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.90"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
