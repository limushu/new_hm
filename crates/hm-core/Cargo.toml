[package]
name = "hm-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
