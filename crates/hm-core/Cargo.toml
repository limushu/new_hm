[package]
name = "hm-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.38", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
url = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Use Apple's SQLite on iOS. Its internal filesystem probes stay within the
# system framework instead of being statically bundled into our executable.
[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
