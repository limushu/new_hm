<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#090d12;--line:#262d36;--text:#d5dae1;--muted:#858e9b;--blue:#84aed8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:hover{color:#f0f3f6}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.symbols{display:none}.titlebar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#717b88;font-size:11px;border-bottom:1px solid #1b2129}.window-controls{display:flex;gap:30px}.window-controls svg{width:11px;height:11px}.shell{display:flex;height:calc(100vh - 32px)}aside{width:192px;flex:none;background:#10151c;border-right:1px solid #222932;padding:18px 10px 12px;display:flex;flex-direction:column}.brand{font-size:14px;display:flex;align-items:center;gap:9px;padding:0 11px;margin-bottom:26px}.brand svg{color:#a6afb9}nav{display:grid;gap:4px}.nav-item{height:33px;display:flex;align-items:center;gap:10px;text-align:left;padding:0 11px;color:#9aa4b1;border-radius:5px}.nav-item.active{background:#212832;color:#e0e5eb}.nav-item.active svg{color:#b5c8dc}.recent{margin:34px 11px 10px;color:#67717f;font-size:11px}.recent-item{padding:7px 11px;color:#8b95a3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aside-bottom{margin-top:auto}.saved{font-size:11px;color:#65717e;padding:10px 12px 0;display:flex;gap:8px;align-items:center}.saved i{width:5px;height:5px;border-radius:50%;background:#6e887d}main{min-width:0;flex:1;overflow:auto}.page-head{padding:25px 30px 0}.heading{display:flex;align-items:center;gap:9px;margin-bottom:18px}.heading svg{width:18px;color:#788592}h1{font-size:19px;font-weight:550;line-height:1.3;margin:0;letter-spacing:.2px}.view-name{display:flex;align-items:center;gap:7px;font-size:12px;color:#a4afbb;padding:7px 0;width:fit-content;border-bottom:2px solid #708ba8}.view-name svg{width:14px;height:14px}.toolbar{margin:0 30px;padding:12px 0 15px;border-top:1px solid #252c35;display:flex;align-items:center;gap:10px}.search{height:30px;border:1px solid #2a323d;border-radius:5px;display:flex;align-items:center;gap:8px;padding:0 10px;width:min(560px,75%);color:#687481}.search svg{width:14px}.search input{background:none;border:0;outline:none;color:var(--text);width:100%;font-size:12px}.search input::placeholder{color:#6d7886}.total{font-size:11px;color:#626e7b}.board{display:flex;align-items:stretch;gap:12px;margin:0 30px 26px;min-height:calc(100vh - 222px);width:max-content}.column{width:278px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 8px;flex-shrink:0}.col-header{display:flex;align-items:center;height:23px;padding:0 5px;gap:7px;margin-bottom:12px}.dot{width:11px;height:11px;border:1.5px solid var(--status);border-radius:50%;flex:none}.col-title{font-size:12px;font-weight:550}.count{font-size:10px;color:#8a95a2;padding:0 5px;border-radius:8px;background:#1b222b;line-height:16px}.col-actions{display:flex;gap:2px;margin-left:auto}.icon-button{display:inline-flex;justify-content:center;align-items:center;width:24px;height:24px;border-radius:4px;color:#697582}.icon-button:hover{background:#212832;color:#c6d1dd}.icon-button svg{width:14px;height:14px}.cards{display:grid;gap:8px}.case{width:100%;display:block;text-align:left;background:var(--bg);border:1px solid #2b333e;border-radius:5px;padding:11px 12px 10px;transition:border-color .12s}.case:hover{border-color:#596c80}.case-meta{font-size:10px;color:#768392;display:flex;align-items:center;gap:5px;margin-bottom:5px}.case-meta svg{width:11px;height:11px;color:#75899c}.case-title{font-size:13px;font-weight:400;line-height:1.55;color:#d7dee7}.case-next{font-size:11px;color:#7d8998;margin-top:7px}.case-next.deadline{color:#bc9d67}.new-case{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;color:#758291;font-size:12px;height:31px;margin-top:7px;border-radius:4px}.new-case:hover{background:#171e27}.new-case svg{width:13px;height:13px}.add-column{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid #2b333e;border-radius:5px;background:#171d25;color:#8e9aa8;flex-shrink:0}.add-column svg{width:15px}.empty{font-size:11px;color:#596572;padding:15px 8px}.menu{position:fixed;z-index:5;width:170px;border:1px solid #343d49;background:#161c24;border-radius:7px;box-shadow:0 8px 24px #0006;padding:5px}.menu button{display:block;text-align:left;width:100%;padding:7px 9px;border-radius:4px;font-size:12px}.menu button:hover{background:#252e39}.menu hr{border:0;border-top:1px solid #303844;margin:4px}.menu-label{padding:5px 9px;color:#6e7b8b;font-size:10px}dialog{background:#141a22;border:1px solid #343d49;border-radius:9px;color:var(--text);padding:24px;width:440px;box-shadow:0 20px 80px #0007}dialog::backdrop{background:#0008}dialog h2{font-size:17px;font-weight:500;margin:0 0 16px}dialog label{display:block;font-size:12px;color:#9aa6b4;margin:12px 0 6px}dialog input{width:100%;padding:8px 10px;background:#0d1117;border:1px solid #364353;border-radius:5px;color:var(--text)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.dialog-actions button{border:1px solid #354152;border-radius:5px;padding:5px 14px}.dialog-actions .primary{background:#294865;border-color:#355f83}.detail-text{font-size:12px;color:#8f9cab}.prototype-note{font-size:11px;margin-top:20px;color:#647181} [hidden]{display:none!important}

/* Revised visual study: neutral surfaces, readable type, content-sized groups. */
:root{--bg:#191919;--panel:#202020;--line:#303030;--text:#deddd9;--muted:#93918d;--blue:#80a3c3}
body{font-size:14px;font-family:"Segoe UI","Microsoft YaHei",sans-serif}.titlebar{background:#202020;border-color:#2b2b2b;color:#8e8d89}aside{width:216px;background:#202020;border-color:#2c2c2c;padding-top:22px}.brand{font-size:15px;margin-bottom:25px}.nav-item{height:34px;color:#a8a6a2;font-size:13px}.nav-item.active{background:#2c2c2c;color:#e4e2de}.nav-item.active svg{color:#c4c1bc}.recent{font-size:11px;color:#777571;margin-top:32px}.recent-item{font-size:12px;color:#999791}.saved{color:#777974}.page-head{padding:62px 54px 0}.heading{gap:10px;margin-bottom:28px}.heading svg{width:25px;height:25px;color:#7299bc}h1{font-size:30px;font-weight:650;letter-spacing:-.6px}.view-name{font-size:13px;background:#292929;border:0;border-radius:16px;padding:5px 11px;color:#d1cfca;gap:7px;margin-bottom:12px}.view-name svg{width:14px;height:14px}.toolbar{margin:-44px 54px 22px 208px;padding:0;height:32px;border:0;justify-content:flex-end;max-width:756px}.search{width:230px;height:29px;border-color:#303030;border-radius:5px;color:#85837f}.search input{font-size:12px}.search input::placeholder{color:#85837f}.total{color:#777570;font-size:11px}.board{margin:0 54px 32px;min-height:0;align-items:flex-start;gap:14px}.column{width:280px;background:#202020;border:0;border-radius:9px;padding:10px 9px 9px}.column:nth-child(2){background:#1d2328}.column:nth-child(3){background:#1d2420}.col-header{height:23px;padding:0 3px;gap:6px;margin-bottom:9px}.dot{width:7px;height:7px;border:0;background:var(--status)}.col-title{font-size:13px;font-weight:500;color:#c9c6c0}.count{font-size:12px;background:none;color:#8c8983;padding:0 4px}.icon-button{color:#8b8984;width:22px;height:22px}.icon-button:hover{background:#ffffff0b;color:#ddd}.case{border:1px solid #343434;background:#232323;border-radius:7px;padding:12px 12px 11px}.column:nth-child(2) .case{background:#232d36;border-color:#2c3945}.column:nth-child(3) .case{background:#25332b;border-color:#2c3c31}.case:hover{border-color:#697078}.case-meta{font-size:11px;color:#a09d96;gap:5px;margin-bottom:6px}.case-meta svg{color:#969fa5}.case-title{font-size:14px;font-weight:500;color:#e0ded9;line-height:1.55}.case-next{font-size:12px;color:#aaa8a2;margin-top:9px}.case-next.deadline{color:#c8ad78}.cards{gap:8px}.new-case{font-size:13px;color:#aaa6a0;height:32px;margin-top:5px;justify-content:flex-start;padding-left:11px}.new-case:hover{background:#ffffff06}.add-column{background:none;border:0;color:#888782;margin-top:7px}.menu{background:#252525;border-color:#3b3b3b}.menu button{font-size:13px}.menu button:hover{background:#353535}.detail-drawer{position:fixed;right:0;top:32px;bottom:0;width:min(690px,60vw);background:#202020;border-left:1px solid #333;z-index:4;box-shadow:-12px 0 35px #0001;overflow:auto}.drawer-toolbar{height:45px;padding:8px 17px;display:flex;align-items:center;justify-content:space-between;color:#8c8984;font-size:12px}.drawer-body{padding:35px 50px 55px}.drawer-symbol{color:#7b9dbb;margin-bottom:14px}.drawer-symbol svg{width:29px;height:29px}.drawer-body h2{font-size:27px;line-height:1.4;font-weight:650;color:#e0ded9;letter-spacing:-.4px;margin:0 0 30px}.properties{display:flex;gap:32px;margin-bottom:38px}.property label{display:block;color:#95928b;font-size:12px;margin-bottom:9px}.property span{font-size:13px;color:#c4c1ba}.status-pill{background:#33463a;color:#b0c7b4!important;padding:2px 8px;border-radius:12px}.drawer-tabs{display:flex;gap:24px;padding-bottom:11px;border-bottom:1px solid #343434;color:#8b8881;font-size:13px}.drawer-tabs .selected{color:#dedbd4}.drawer-section{margin-top:34px}.drawer-section h3{font-size:16px;font-weight:550;margin:0 0 15px;color:#d9d6cf}.schedule-row{font-size:13px;display:flex;gap:20px;color:#c9c5bc;padding:9px 0}.schedule-row time{color:#98958c;width:85px;flex:none}.schedule-row .deadline-text{color:#c5aa76}.todo-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:#c9c5bd}.todo-row input{accent-color:#778e7a;width:14px;height:14px}.work-row{font-size:13px;color:#b2aea4;line-height:1.8;margin-bottom:11px}.work-row small{display:block;color:#79766e;font-size:11px}.drawer-footer{margin-top:35px;color:#76736d;font-size:11px}.detail-open .case{transition:none}.detail-open main{overflow:hidden}

/* DESIGN-NOTION-COLOR: provisional palette; review surfaces, status colors and text together. */
dialog{background:#202020;border-color:#373737;padding:28px;width:480px;color:#deddd9}dialog h2{font-size:19px;font-weight:550;margin-bottom:7px}.form-intro{font-size:12px;color:#93918d;margin:0 0 22px}dialog label{color:#b4b1aa;font-size:12px;margin-top:17px}dialog input,dialog select{background:#191919;border:1px solid #3a3a3a;border-radius:5px;color:#deddd9;padding:9px 10px;width:100%;font:inherit;font-size:13px}dialog input:focus,dialog select:focus{border-color:#778b9d}.optional-fields{margin-top:20px;border-top:1px solid #333;padding-top:13px}.optional-fields summary{font-size:12px;color:#a5a19a;cursor:pointer}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-actions button{border-color:#3c3c3c;font-size:12px}.dialog-actions .primary{background:#354b5e;border-color:#45647d}.prototype-note{color:#7d7971}.required-label{font-size:10px;margin-left:7px;color:#85817a}
</style>

<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3z"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol><symbol id="users" viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 21v-3a7 7 0 0 1 14 0v3m0-17a4 4 0 0 1 0 8m4 9v-3a6 6 0 0 0-2-4"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="board-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16"/></symbol><symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v6h5"/></symbol>
</defs></svg>
<div class="titlebar"><span>律案</span><div class="window-controls"><span>—</span><span>□</span><span>×</span></div></div>
<div class="shell"><aside><div class="brand"><svg><use href="#folder"/></svg>律案</div><nav><button class="nav-item" id="focus-search"><svg><use href="#search"/></svg>搜索</button><div class="nav-item"><svg><use href="#calendar"/></svg>今天</div><div class="nav-item active"><svg><use href="#folder"/></svg>案件</div><div class="nav-item"><svg><use href="#users"/></svg>联系人</div></nav><div class="recent">最近案件</div><div class="recent-item">张某与李某借款纠纷</div><div class="recent-item">王某劳动争议案</div><div class="aside-bottom"><div class="nav-item"><svg><use href="#settings"/></svg>设置</div><div class="saved"><i></i>本地工作空间</div></div></aside>
<main><div class="page-head"><div class="heading"><svg><use href="#folder"/></svg><h1>案件</h1></div><div class="view-name"><svg><use href="#board-icon"/></svg>按状态</div></div><div class="toolbar"><div class="search"><svg><use href="#search"/></svg><input id="search-input" aria-label="搜索案件" placeholder="搜索案件名称、案号"></div><span class="total" id="total"></span></div><div id="board" class="board"></div></main></div>
<div id="menu" class="menu" hidden></div><dialog id="dialog"></dialog>
<script>
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const columns=[{name:'未开始',color:'#7d8b9b',items:[{title:'林某合同纠纷',meta:'民商事诉讼',next:''},{title:'赵某房屋租赁纠纷',meta:'民商事诉讼',next:''}]},{name:'进行中',color:'#b39a62',items:[{title:'张某与李某借款纠纷',meta:'一审 · 庭前准备',next:'10月23日 · 举证期限',deadline:true},{title:'王某劳动争议案',meta:'一审 · 等待开庭',next:'10月20日 · 会见当事人'},{title:'远山公司买卖合同纠纷',meta:'二审 · 已立案',next:'10月26日 · 提交材料'}]},{name:'已结案',color:'#738f80',items:[{title:'周某物业服务合同纠纷',meta:'民商事诉讼',next:'10月12日结案'}]}];
const board=document.querySelector('#board'),search=document.querySelector('#search-input'),menu=document.querySelector('#menu'),dialog=document.querySelector('#dialog');
function render(){const q=search.value.trim();let total=0;board.innerHTML=columns.map((col,ci)=>{const items=col.items.map((item,ii)=>({...item,ii})).filter(i=>i.title.includes(q)||(i.number||'').includes(q));total+=items.length;return `<section class="column" style="--status:${col.color}" aria-label="${esc(col.name)}"><div class="col-header"><i class="dot"></i><span class="col-title">${esc(col.name)}</span><span class="count">${items.length}</span><div class="col-actions"><button class="icon-button" title="管理${esc(col.name)}列" data-menu="${ci}">${icon('more')}</button><button class="icon-button" title="在${esc(col.name)}中新建案件" data-new="${ci}">${icon('plus')}</button></div></div><div class="cards">${items.map(i=>`<button class="case" data-case="${ci},${i.ii}"><div class="case-meta">${icon('file')}${esc(i.meta)}</div><div class="case-title">${esc(i.title)}</div>${i.next?`<div class="case-next ${i.deadline?'deadline':''}">${esc(i.next)}</div>`:''}</button>`).join('')}</div>${ci===0?`<button class="new-case" data-new="0">${icon('plus')}新建案件</button>`:''}</section>`}).join('')+`<button class="add-column" id="add-column" title="添加状态" aria-label="添加状态">${icon('plus')}</button>`;document.querySelector('#total').textContent=`${total} 个案件`;}
function editForm(title,label,value,submit){dialog.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2><label for="entry">${esc(label)}</label><input id="entry" required maxlength="80" value="${esc(value)}"><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div><div class="prototype-note">界面演示，修改仅保留在本次打开期间。</div></form>`;dialog.querySelector('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const value=dialog.querySelector('#entry').value.trim();if(!value)return;submit(value);dialog.close();render()};dialog.showModal();dialog.querySelector('input').select();}
board.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.new!==undefined){const ci=+b.dataset.new;createCase(ci);}else if(b.id==='add-column'){editForm('添加状态','状态名称','',value=>columns.push({name:value,color:'#7d8b9b',items:[]}));}else if(b.dataset.case){const [ci,ii]=b.dataset.case.split(',').map(Number),item=columns[ci].items[ii];openCase(item,columns[ci].name);}else if(b.dataset.menu!==undefined){const ci=+b.dataset.menu;menu.innerHTML=`<div class="menu-label">管理状态列</div><button data-action="rename">重命名</button>${ci>0?'<button data-action="left">向左移动</button>':''}${ci<columns.length-1?'<button data-action="right">向右移动</button>':''}`;menu.hidden=false;const r=b.getBoundingClientRect();menu.style.left=Math.min(r.left,innerWidth-180)+'px';menu.style.top=r.bottom+4+'px';menu.onclick=e=>{const a=e.target.dataset.action;if(!a)return;menu.hidden=true;if(a==='rename')editForm('重命名状态','状态名称',columns[ci].name,value=>columns[ci].name=value);else{const target=ci+(a==='left'?-1:1);[columns[ci],columns[target]]=[columns[target],columns[ci]];render();}};}});
document.addEventListener('click',e=>{if(!e.target.closest('[data-menu],#menu'))menu.hidden=true;});document.addEventListener('keydown',e=>{if(e.key==='Escape')menu.hidden=true;});search.addEventListener('input',render);document.querySelector('#focus-search').onclick=()=>search.focus();render();

function closeCase(){document.querySelector('.detail-drawer')?.remove();document.body.classList.remove('detail-open');}
function openCase(item,status){closeCase();const pane=document.createElement('section');pane.className='detail-drawer';pane.setAttribute('aria-label','案件详情预览');pane.innerHTML=`<div class="drawer-toolbar"><button id="close-case" title="关闭详情">↗ 返回看板</button><span>案件概览</span></div><div class="drawer-body"><div class="drawer-symbol">${icon('folder')}</div><h2>${esc(item.title)}</h2><div class="properties"><div class="property"><label>案件状态</label><span class="status-pill">${esc(status)}</span></div><div class="property"><label>当前程序与阶段</label><span>${esc(item.meta)}</span></div></div>${item.isNew?`<div class="detail-text">${[item.number,item.party,item.court,item.judge].filter(Boolean).map(esc).join(' · ')}</div>`:''}<div class="drawer-tabs"><span class="selected">概览</span><span>材料</span><span>案件信息</span><span>收支</span></div><section class="drawer-section"><h3>近期安排</h3><div class="schedule-row"><span class="${item.deadline?'deadline-text':''}">${esc(item.next||'暂无安排')}</span></div></section><section class="drawer-section"><h3>待办</h3>${item.isNew?'<div class="work-row">暂无待办</div>':'<label class="todo-row"><input type="checkbox">核对案件材料</label><label class="todo-row"><input type="checkbox">与当事人确认后续安排</label>'}</section><section class="drawer-section"><h3>工作记录</h3>${item.isNew?'<div class="work-row">暂无工作记录</div>':'<div class="work-row">已整理现有材料，待补充相关信息。<small>今天 · 示例记录</small></div>'}</section><div class="drawer-footer">界面原型 · 虚构示例数据</div></div>`;document.body.append(pane);document.body.classList.add('detail-open');pane.querySelector('#close-case').onclick=closeCase;pane.querySelector('#close-case').focus();}
 document.addEventListener('keydown',e=>{if(e.key!=='Escape'||dialog.open)return;const preview=document.querySelector('.material-preview');if(preview){preview.remove();e.stopImmediatePropagation();return;}closeCase();});
</script>
